<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>

        <link rel="stylesheet" href="style.css" />
        <link
            rel="shortcut icon"
            href="./Assets/img/4_enemie_boss_chicken/2_alert/G10.png"
            type="image/x-icon"
        />
        <script type="module" src="./game.js"></script>
    </head>
    <body>
        <header>
            <h1>El Pollo Loco</h1>
        </header>
        <main>
            <div>
                <p>The chicken are out to get you!</p>
                <p>Press SPACE or UP to jump</p>
                <p>Press LEFT and RIGHT to move through the level</p>
                <p>Press D to throw bottles</p>
                <p>Small chicken and chicks can be killed by jumping on them, but the Endboss can only be killed with bottles, so use them sparingly.</p>
            </div>
            <canvas width="720" height="480" id="canvas"></canvas>
        </main>
        <footer>
            <p>Impressum</p>
        </footer>
    </body>
</html>
